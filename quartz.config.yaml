# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json

configuration:
  pageTitle: Latent Space
  pageTitleSuffix: " · GKCY"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: gkcy.github.io/LatentSpace
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    # Prefer platform-native fonts and avoid runtime Google Fonts requests.
    fontOrigin: local
    cdnCaching: false
    typography:
      title: system-ui
      header: system-ui
      body: system-ui
      code: ui-monospace
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#285b78"
        tertiary: "#4f7f76"
        highlight: rgba(76, 112, 132, 0.14)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#8ab4cc"
        tertiary: "#84a59d"
        highlight: rgba(112, 148, 168, 0.18)
        textHighlight: "#b3aa0288"

plugins:
  # Parse Obsidian/YAML frontmatter without rendering a properties panel.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5

  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - git
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  # Keep the native outline visible in the sticky desktop sidebar. The default
  # frame renders the same heading data as a floating drawer below 1200px.
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 3
      # The plugin uses a strict threshold, so 1 displays a TOC from 2 headings.
      minEntries: 1
      showByDefault: true
      collapseByDefault: false
      layout: modern
    order: 50
    layout:
      position: right
      priority: 5
      condition: has-toc

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90

  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: local

  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: "@quartz-community/favicon"
    enabled: true

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true

  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
      display: desktop-only

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 30
      display: desktop-only

  # Existing notes already contain their own H1 headings.
  - source: "@quartz-community/article-title"
    enabled: false

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/GKCY/LatentSpace
    layout:
      position: footer
      priority: 50

  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: 最近更新
      limit: 6
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: afterBody
      priority: 10
      condition: index

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
